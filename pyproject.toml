[project]
name = "mimir-engine"
version = "0.1.0"
description = "Mass-scale RAG ingestion workflow: MinIO + Kafka + Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6",
    "minio>=7.2",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pypdf>=5.1",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3"]

[project.scripts]
mimir = "mimir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mimir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
