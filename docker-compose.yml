x-mimir: &mimir
  build: .
  image: mimir-engine:latest
  env_file:
    - path: .env
      required: false
  environment: &mimir-env
    MIMIR_KAFKA_BOOTSTRAP: kafka:9092
    MIMIR_S3_ENDPOINT: minio:9000
    MIMIR_QDRANT_URL: http://qdrant:6333
    MIMIR_OLLAMA_URL: http://host.docker.internal:11434  # Ollama runs on the host, where it can use the GPU

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  init:
    <<: *mimir
    command: ["init"]
    restart: on-failure  # retries until qdrant is accepting connections
    depends_on:
      kafka: {condition: service_healthy}
      minio: {condition: service_healthy}
      qdrant: {condition: service_started}

  api:
    <<: *mimir
    command: ["api"]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}

  worker:
    <<: *mimir
    command: ["worker"]
    restart: unless-stopped
    deploy:
      replicas: 3  # scale with `docker compose up -d --scale worker=N` (N <= topic partitions, 12)
    depends_on:
      init: {condition: service_completed_successfully}

volumes:
  kafka-data:
  minio-data:
  qdrant-data:
